<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); }
  .row { display:flex; align-items:flex-end; gap: 12px; flex-wrap: wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap: 6px; }
  .box { background: var(--accent-100); border: 1px solid var(--accent-200); }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--fg-subtle); }
  .lab { font: 500 12px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 12px; }
</style></head>
<body>
  <p class="lab">Spacing scale · 4px base</p>
  <div class="row">
    <div class="item"><div class="box" style="width:4px;height:24px"></div><div class="meta">1 · 4</div></div>
    <div class="item"><div class="box" style="width:8px;height:24px"></div><div class="meta">2 · 8</div></div>
    <div class="item"><div class="box" style="width:12px;height:24px"></div><div class="meta">3 · 12</div></div>
    <div class="item"><div class="box" style="width:16px;height:24px"></div><div class="meta">4 · 16</div></div>
    <div class="item"><div class="box" style="width:24px;height:24px"></div><div class="meta">6 · 24</div></div>
    <div class="item"><div class="box" style="width:32px;height:24px"></div><div class="meta">8 · 32</div></div>
    <div class="item"><div class="box" style="width:48px;height:24px"></div><div class="meta">12 · 48</div></div>
    <div class="item"><div class="box" style="width:64px;height:24px"></div><div class="meta">16 · 64</div></div>
    <div class="item"><div class="box" style="width:96px;height:24px"></div><div class="meta">24 · 96</div></div>
  </div>
</body></html>
