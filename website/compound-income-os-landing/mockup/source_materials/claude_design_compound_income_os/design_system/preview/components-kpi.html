<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body { padding: 20px; background: var(--bg-canvas); display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }</style></head>
<body>
  <div class="kpi">
    <div class="kpi-label">Total Assets</div>
    <div class="kpi-value">€37,250</div>
    <div class="kpi-trend"><span class="pill ok">OK</span> +€1,420 r/r</div>
  </div>
  <div class="kpi">
    <div class="kpi-label">Buy Score</div>
    <div class="kpi-value">71.8</div>
    <div class="kpi-trend"><span class="pill partial">PARTIAL</span> +2.1</div>
  </div>
  <div class="kpi">
    <div class="kpi-label">Annual Income</div>
    <div class="kpi-value">€715</div>
    <div class="kpi-trend"><span class="pill partial">PARTIAL</span> +€43</div>
  </div>
  <div class="kpi">
    <div class="kpi-label">Missing Required KPIs</div>
    <div class="kpi-value">7</div>
    <div class="kpi-trend"><span class="pill missing">MISSING_DATA</span></div>
  </div>
</body></html>
