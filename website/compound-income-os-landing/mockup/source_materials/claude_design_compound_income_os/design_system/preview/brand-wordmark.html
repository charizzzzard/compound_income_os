<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); display:grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
  .ink-tile { background: var(--paper-50); border: 1px solid var(--border-default); border-radius: 10px; padding: 22px; display:flex; align-items: center; justify-content: center; min-height: 110px; }
  .dark-tile { background: var(--dark-800); border: 1px solid var(--dark-700); border-radius: 10px; padding: 22px; display:flex; align-items: center; justify-content: center; min-height: 110px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
  img { height: 26px; width: auto; }
</style></head>
<body>
  <div class="ink-tile"><img src="../assets/wordmark-ink.svg" alt="Compound Income OS"></div>
  <div class="dark-tile"><img src="../assets/wordmark-paper.svg" alt="Compound Income OS"></div>
</body></html>
