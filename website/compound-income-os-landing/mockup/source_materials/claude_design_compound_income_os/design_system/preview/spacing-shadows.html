<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 32px 24px; background: var(--bg-canvas); display:grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .item { display:flex; flex-direction:column; align-items:flex-start; gap: 10px; }
  .card { width: 130px; height: 70px; background: var(--bg-elevated); border-radius: 12px; border: 1px solid var(--border-default); }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--fg-subtle); }
</style></head>
<body>
  <div class="item"><div class="card" style="box-shadow: var(--shadow-xs)"></div><div class="meta">xs · resting card</div></div>
  <div class="item"><div class="card" style="box-shadow: var(--shadow-sm)"></div><div class="meta">sm</div></div>
  <div class="item"><div class="card" style="box-shadow: var(--shadow-md)"></div><div class="meta">md · hover</div></div>
  <div class="item"><div class="card" style="box-shadow: var(--shadow-lg)"></div><div class="meta">lg · popover</div></div>
</body></html>
