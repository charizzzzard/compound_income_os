<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); display:grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: end; }
  .item { display:flex; flex-direction: column; gap: 6px; align-items: center; }
  .box { width: 64px; height: 64px; background: var(--bg-elevated); border: 1px solid var(--border-default); }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--fg-subtle); }
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="meta">xs · 4</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="meta">sm · 6</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="meta">md · 10</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="meta">lg · 12</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="meta">xl · 16</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="meta">pill</div></div>
</body></html>
