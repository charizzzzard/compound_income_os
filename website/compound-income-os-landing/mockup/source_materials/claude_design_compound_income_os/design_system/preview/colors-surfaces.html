<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { padding: 24px; border-radius: 12px; }
  .light { background: var(--paper-50); border: 1px solid var(--border-default); }
  .dark { background: var(--dark-800); color: var(--dark-fg); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
  .num { font: 500 28px/1 var(--font-mono); letter-spacing: -0.01em; }
  .lab { font: 500 12px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 8px; }
  .dark .lab { color: var(--dark-fg-3); }
  .gold { color: var(--gold-500); }
  .dark .gold { color: var(--gold-300); }
</style></head>
<body>
  <div class="row">
    <div class="panel light">
      <div class="lab">Light surface</div>
      <div class="num">€37,250</div>
      <div style="font: 400 12px/1.5 var(--font-mono); color: var(--fg-subtle); margin-top:6px;">+€1,420 run-over-run · <span class="gold">Pro Module</span></div>
    </div>
    <div class="panel dark">
      <div class="lab">Dark accent surface</div>
      <div class="num">€37,250</div>
      <div style="font: 400 12px/1.5 var(--font-mono); color: var(--dark-fg-2); margin-top:6px;">DEMO-20260426 · <span class="gold">Pro Module</span></div>
    </div>
  </div>
</body></html>
