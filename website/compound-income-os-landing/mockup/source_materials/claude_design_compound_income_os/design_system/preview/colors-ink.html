<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); }
  .row { display: grid; grid-template-columns: repeat(8,1fr); gap: 8px; }
  .sw { border-radius: 8px; height: 70px; border: 1px solid var(--border-faint); display:flex; align-items:flex-end; padding: 6px 8px; }
  .sw .c { font: 500 10px/1.2 var(--font-mono); padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,0.85); color: #14181C; }
  .sw.dark .c { color: #E7ECF2; background: rgba(0,0,0,0.35); }
  .label { font: 500 12px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 10px; }
</style></head>
<body>
  <p class="label">Ink / Text scale</p>
  <div class="row">
    <div class="sw dark" style="background:var(--ink-900)"><span class="c">900</span></div>
    <div class="sw dark" style="background:var(--ink-800)"><span class="c">800</span></div>
    <div class="sw dark" style="background:var(--ink-700)"><span class="c">700</span></div>
    <div class="sw dark" style="background:var(--ink-600)"><span class="c">600</span></div>
    <div class="sw dark" style="background:var(--ink-500)"><span class="c">500</span></div>
    <div class="sw" style="background:var(--ink-400)"><span class="c">400</span></div>
    <div class="sw" style="background:var(--ink-300)"><span class="c">300</span></div>
    <div class="sw" style="background:var(--ink-200)"><span class="c">200</span></div>
  </div>
</body></html>
