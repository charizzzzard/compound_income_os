<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); }
  .row { display: grid; grid-template-columns: repeat(9,1fr); gap: 6px; }
  .sw { border-radius: 8px; height: 64px; border: 1px solid rgba(0,0,0,0.05); display:flex; align-items:flex-end; padding: 6px 7px; }
  .c { font: 500 10px/1.2 var(--font-mono); padding: 2px 4px; border-radius: 4px; background: rgba(255,255,255,0.85); color: #14181C; }
  .dark .c { background: rgba(0,0,0,0.4); color: #fff; }
  .label { font: 500 12px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 6px; }
  .note { font: 400 12px/1.4 var(--font-sans); color: var(--fg-muted); margin: 0 0 10px; }
  .note b { color: var(--fg-default); font-weight: 500; }
</style></head>
<body>
  <p class="label">Accent · graphite blue</p>
  <p class="note">Single brand accent. <b>500</b> is canonical — primary buttons, links, the primary chart line.</p>
  <div class="row">
    <div class="sw" style="background:var(--accent-50)"><span class="c">50</span></div>
    <div class="sw" style="background:var(--accent-100)"><span class="c">100</span></div>
    <div class="sw" style="background:var(--accent-200)"><span class="c">200</span></div>
    <div class="sw" style="background:var(--accent-300)"><span class="c">300</span></div>
    <div class="sw dark" style="background:var(--accent-400)"><span class="c">400</span></div>
    <div class="sw dark" style="background:var(--accent-500); outline: 2px solid var(--gold-500); outline-offset: 2px"><span class="c">500</span></div>
    <div class="sw dark" style="background:var(--accent-600)"><span class="c">600</span></div>
    <div class="sw dark" style="background:var(--accent-700)"><span class="c">700</span></div>
    <div class="sw dark" style="background:var(--accent-900)"><span class="c">900</span></div>
  </div>
</body></html>
