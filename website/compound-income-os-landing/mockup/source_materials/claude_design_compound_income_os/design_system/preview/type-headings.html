<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; background: var(--bg-canvas); }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 7px 12px 7px 0; vertical-align: baseline; border-bottom: 1px solid var(--border-faint); }
  td.k { font: 500 12px/1 var(--font-mono); color: var(--fg-subtle); width: 90px; white-space: nowrap;}
  td.s { font: 400 11px/1 var(--font-mono); color: var(--ink-400); width: 100px; white-space: nowrap; text-align: right; }
  td:last-child { color: var(--fg-strong); }
</style></head>
<body>
  <table>
    <tr><td class="k">display-1</td><td style="font:600 38px/1 var(--font-sans); letter-spacing:-0.02em">A local operating system.</td><td class="s">72/78 · -0.02</td></tr>
    <tr><td class="k">display-2</td><td style="font:500 30px/1.05 var(--font-sans); letter-spacing:-0.02em">Compounding, made auditable.</td><td class="s">56/60 · -0.02</td></tr>
    <tr><td class="k">h1</td><td style="font:600 24px/1.1 var(--font-sans); letter-spacing:-0.02em">Monthly decision queue</td><td class="s">44/46</td></tr>
    <tr><td class="k">h2</td><td style="font:500 20px/1.2 var(--font-sans)">Evidence & data quality</td><td class="s">32/40</td></tr>
    <tr><td class="k">h3</td><td style="font:500 17px/1.25 var(--font-sans)">Score & fundamentals</td><td class="s">24/30</td></tr>
    <tr><td class="k">h4</td><td style="font:600 14px/1.4 var(--font-sans)">Coverage status</td><td class="s">18/25</td></tr>
  </table>
</body></html>
