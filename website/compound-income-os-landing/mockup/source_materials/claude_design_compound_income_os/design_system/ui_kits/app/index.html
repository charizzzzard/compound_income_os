<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compound Income OS — App</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="app.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel" src="DashboardView.jsx"></script>
  <script type="text/babel" src="DividendSnowballView.jsx"></script>
  <script type="text/babel" src="Views.jsx"></script>
  <script type="text/babel">
    const { useState } = React;

    const CRUMBS = {
      dashboard: ["Compound Income OS", "Dashboard"],
      monthly:   ["Compound Income OS", "Workflow", "Monthly Run · April 2026"],
      watchlist: ["Compound Income OS", "Research", "Watchlist"],
      ranking:   ["Compound Income OS", "Research", "Ranking"],
      snowball:  ["Compound Income OS", "Research", "Dividend Snowball"],
      evidence:  ["Compound Income OS", "Evidence", "SEC Evidence"],
      quality:   ["Compound Income OS", "Evidence", "Data Quality"],
      fundamentals: ["Compound Income OS", "Evidence", "Fundamentals"],
      journal:   ["Compound Income OS", "Records", "Decision Journal"],
      reports:   ["Compound Income OS", "Records", "Reports"],
      settings:  ["Compound Income OS", "Settings"],
    };
    const RUN = "DEMO-20260426-160500";

    function App() {
      const [view, setView] = useState("dashboard");
      const [holding, setHolding] = useState(null);
      let body;
      switch (view) {
        case "dashboard": body = <DashboardView onOpenHolding={setHolding} />; break;
        case "monthly":   body = <MonthlyRunView />; break;
        case "journal":   body = <JournalView />; break;
        case "evidence":  body = <EvidenceView />; break;
        case "watchlist": body = <PlaceholderView title="Watchlist" sub="Candidates ordered by transparent business, valuation, and rule-based candidate-score components." />; break;
        case "ranking":   body = <PlaceholderView title="Ranking"   sub="Cash-aware, rule-based decision queue. Eligible, deferred, blocked." />; break;
        case "snowball":  body = <DividendSnowballView />; break;
        case "quality":   body = <PlaceholderView title="Data Quality" sub="COVERED, PARTIAL, REVIEW, NO_MATCH, MISSING_DATA, INSUFFICIENT_INPUTS, INSUFFICIENT_HISTORY — first-class outputs." />; break;
        case "fundamentals": body = <PlaceholderView title="Fundamentals master" sub="The local fundamentals_master.csv with revision-tracked, evidence-applied edits." />; break;
        case "reports":   body = <PlaceholderView title="Reports" sub="Generated artifacts: positions snapshot, company scores, monthly ranking, decision report." />; break;
        case "settings":  body = <PlaceholderView title="Settings" sub="Local paths, rule files, evidence eligibility, and module toggles." />; break;
        default: body = null;
      }
      return (
        <>
          <AppShell active={view} onNav={setView} crumbs={CRUMBS[view]} runId={RUN}>{body}</AppShell>
          <HoldingDrawer holding={holding} onClose={() => setHolding(null)} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
