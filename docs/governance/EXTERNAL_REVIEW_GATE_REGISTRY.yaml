{
  "schema_version": 1,
  "registry_purpose": "Machine-readable registry of CIOS external review gates. This is governance documentation only and does not implement runtime enforcement or release acceptance.",
  "operator_acceptance_authority": "Human Operator",
  "gates": [
    {
      "gate_id": "SEMANTIC_DECISION_QUALITY_REVIEW",
      "gate_name": "Semantic Decision Quality Review",
      "priority": "P0",
      "purpose": "Review whether scoring, ranking, valuation and decision-quality surfaces remain decision support and do not overstate investment confidence.",
      "trigger_condition": "Before valuation automation, scoring formula changes, decision-quality claims or dashboard action signals.",
      "required_inputs": ["score audit artifacts", "ranking outputs", "decision quality artifacts", "valuation method docs", "current feature status"],
      "required_outputs": ["semantic decision-quality findings", "overclaim review", "operator-facing limitation notes"],
      "acceptance_criteria": ["missing and stale data remain visible", "process confidence is not presented as investment confidence", "no advice or order-execution claim is introduced"],
      "non_scope": ["changing scoring formulas", "investment advice", "valuation automation"],
      "blocks_features": ["valuation_automation", "scoring_formula_changes", "decision_quality_claims", "dashboard_action_signals"],
      "evidence_required": ["review matrix", "source artifact list", "operator acceptance record"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "AS_OF_TEMPORAL_INTEGRITY_REVIEW",
      "gate_name": "As-Of Temporal Integrity Review",
      "priority": "P0",
      "purpose": "Review as_of, recorded, effective, trade, settlement and freshness semantics across future replay, ledger and valuation flows.",
      "trigger_condition": "Before replay, backtesting, outcome attribution or valuation automation.",
      "required_inputs": ["data freshness contract", "event ledger contract", "stage DAG", "history/performance docs"],
      "required_outputs": ["temporal integrity matrix", "stale/unknown handling findings"],
      "acceptance_criteria": ["no silent temporal imputation", "stale/unknown states remain visible", "point-in-time assumptions are explicit"],
      "non_scope": ["replay implementation", "backtesting implementation", "FX conversion"],
      "blocks_features": ["replay", "backtesting", "outcome_attribution", "valuation_automation"],
      "evidence_required": ["temporal review report", "affected file list"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "INSTRUMENT_IDENTITY_AND_MAPPING_REVIEW",
      "gate_name": "Instrument Identity And Mapping Review",
      "priority": "P0",
      "purpose": "Review canonical instrument identity, alias, broker-symbol and provider-ID mapping risks.",
      "trigger_condition": "Before Instrument Master expansion, Broker Import Staging or Event Ledger Runtime.",
      "required_inputs": ["instrument master contract", "instrument template", "source registry docs", "broker/provider mapping proposal"],
      "required_outputs": ["identity conflict findings", "mapping boundary report"],
      "acceptance_criteria": ["ticker-only identity prohibited", "broker/provider IDs are mappings only", "conflicts remain review-required"],
      "non_scope": ["online lookup", "provider approval", "runtime matching engine"],
      "blocks_features": ["instrument_master_expansion", "broker_import_staging", "production_event_ledger"],
      "evidence_required": ["identity review matrix", "operator review record"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "DATA_CONFLICT_AND_PROVENANCE_REVIEW",
      "gate_name": "Data Conflict And Provenance Review",
      "priority": "P0",
      "purpose": "Review source provenance, provider conflicts and evidence separation before data is merged or treated as authoritative.",
      "trigger_condition": "Before provider integration, data merge automation, broker import or valuation automation.",
      "required_inputs": ["data source strategy", "license boundary contract", "source registry template", "provenance fields"],
      "required_outputs": ["source conflict matrix", "provenance gap report"],
      "acceptance_criteria": ["freshness is not treated as identity evidence", "license evidence is not treated as event evidence", "conflicts do not resolve silently"],
      "non_scope": ["legal approval", "provider approval", "commercial approval"],
      "blocks_features": ["provider_integration", "broker_import_staging", "valuation_automation", "public_handoff_data_claims"],
      "evidence_required": ["provenance review report", "conflict examples or explicit absence statement"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "ADVERSARIAL_INPUT_AND_FAILURE_MODE_REVIEW",
      "gate_name": "Adversarial Input And Failure Mode Review",
      "priority": "P0",
      "purpose": "Review malformed, conflicting, poisoned and boundary-case inputs against validators and runtime surfaces.",
      "trigger_condition": "Before runtime enforcement, broker import staging, release gate automation or public demo surfaces.",
      "required_inputs": ["validators", "tests", "contracts", "sample negative fixtures"],
      "required_outputs": ["failure-mode matrix", "negative-test coverage findings"],
      "acceptance_criteria": ["invalid inputs fail closed or become review-required", "no silent imputation", "no private/raw data leakage"],
      "non_scope": ["production data ingestion", "new feature implementation"],
      "blocks_features": ["runtime_stage_integration", "broker_import_staging", "public_demo_surfaces"],
      "evidence_required": ["negative test list", "uncovered failure modes"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "OPERATOR_COMPREHENSION_REVIEW",
      "gate_name": "Operator Comprehension Review",
      "priority": "P1",
      "purpose": "Review whether operator-facing reports and summaries can be misunderstood as advice, readiness or order instructions.",
      "trigger_condition": "Before dashboard expansion, public demo surfaces or action-like UI.",
      "required_inputs": ["reports", "dashboard/operator summaries", "README", "non-scope docs"],
      "required_outputs": ["operator ambiguity findings", "wording risk report"],
      "acceptance_criteria": ["review states are distinguishable from actions", "not available states are visible", "human-final-decision remains clear"],
      "non_scope": ["UI implementation", "investment advice"],
      "blocks_features": ["dashboard_expansion", "public_demo_surfaces", "action_or_signal_like_ui"],
      "evidence_required": ["operator comprehension checklist", "reviewed surfaces"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "DECISION_SUPPORT_COMPLIANCE_REVIEW",
      "gate_name": "Decision Support Compliance Review",
      "priority": "P0",
      "purpose": "Review advice, tax, legal, commercial and misuse boundaries in public-facing or operator-facing materials.",
      "trigger_condition": "Before public packaging, commercial packaging, marketing claims or advice-like reports.",
      "required_inputs": ["README", "reports", "contracts", "governance docs", "handoff context"],
      "required_outputs": ["compliance boundary findings", "non-scope preservation report"],
      "acceptance_criteria": ["no investment advice claim", "no tax/legal/commercial approval claim", "no order execution or broker-readiness claim"],
      "non_scope": ["legal opinion", "tax advice", "commercial approval"],
      "blocks_features": ["public_packaging", "commercial_packaging", "marketing_claims", "advice_like_reports"],
      "evidence_required": ["compliance review report", "operator acceptance record"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "CLEAN_ROOM_REPRODUCTION_REVIEW",
      "gate_name": "Clean-Room Reproduction Review",
      "priority": "P0",
      "purpose": "Verify that a reviewer can reproduce required checks from a clean extraction without relying on local untracked state.",
      "trigger_condition": "Before public release, major external review or commercial packaging.",
      "required_inputs": ["handoff zip", "sha256", "readme first", "handoff context", "validation commands"],
      "required_outputs": ["clean-room reproduction log", "environment constraints", "pass/fail findings"],
      "acceptance_criteria": ["SHA matches", "ZIP integrity passes", "required files exist", "documented commands are reproducible or failures are explained"],
      "non_scope": ["feature implementation", "private raw data reproduction"],
      "blocks_features": ["public_release", "major_external_review", "commercial_packaging"],
      "evidence_required": ["independent extraction log", "command results", "environment notes"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "CROSS_PATCH_REGRESSION_REVIEW",
      "gate_name": "Cross-Patch Regression Review",
      "priority": "P0",
      "purpose": "Review whether a new kernel patch breaks previous contracts, known gaps, maturity, feature status or non-scope boundaries.",
      "trigger_condition": "Before kernel patch acceptance, governance baseline acceptance or major handoff acceptance.",
      "required_inputs": ["current patch diff", "feature status", "maturity model", "known gaps", "targeted tests", "previous accepted kernels"],
      "required_outputs": ["cross-patch regression matrix", "blocked or accepted findings"],
      "acceptance_criteria": ["previous non-scope boundaries preserved", "maturity not overstated", "old required files still included", "targeted tests pass or failures are classified"],
      "non_scope": ["full feature review", "runtime implementation"],
      "blocks_features": ["kernel_patch_acceptance", "governance_baseline_acceptance", "major_handoff_acceptance"],
      "evidence_required": ["regression matrix", "test command log"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "LOCAL_SECURITY_AND_SECRET_HYGIENE_REVIEW",
      "gate_name": "Local Security And Secret Hygiene Review",
      "priority": "P0",
      "purpose": "Review handoff and repo artifacts for private data, secrets, credentials and local path leakage.",
      "trigger_condition": "Before any external handoff, public packaging or broker/provider integration.",
      "required_inputs": ["handoff zip", "manifest", "forbidden-pattern scans", "ignored/private path rules"],
      "required_outputs": ["secret hygiene findings", "leakage scan summary"],
      "acceptance_criteria": ["no private raw data", "no credentials", "no local absolute user paths", "forbidden matches are zero or explicitly blocked"],
      "non_scope": ["security architecture", "penetration test"],
      "blocks_features": ["external_handoff", "public_packaging", "broker_import_staging", "provider_integration"],
      "evidence_required": ["scan results", "omitted artifacts registry"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "RUNTIME_ENFORCEMENT_BOUNDARY_REVIEW",
      "gate_name": "Runtime Enforcement Boundary Review",
      "priority": "P0",
      "purpose": "Review whether documentation-only, template-only and runtime-enforced boundaries are clearly separated.",
      "trigger_condition": "Before runtime stage integration, production workflow claims or dashboard readiness claims.",
      "required_inputs": ["contracts", "validators", "stage DAG", "runtime code", "tests"],
      "required_outputs": ["enforcement boundary map", "documentation-only risk findings"],
      "acceptance_criteria": ["template validation is not described as runtime validation", "runtime claims have code and tests", "documentation-only controls remain labeled"],
      "non_scope": ["runtime implementation", "feature readiness approval"],
      "blocks_features": ["runtime_stage_integration", "production_workflow_claims", "dashboard_readiness_claims"],
      "evidence_required": ["boundary map", "claim-to-evidence trace"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "BROKER_IMPORT_STAGING_READINESS_REVIEW",
      "gate_name": "Broker Import Staging Readiness Review",
      "priority": "P0",
      "purpose": "Review whether broker import staging has contracts, identity mapping, event mapping, privacy handling and tests before implementation.",
      "trigger_condition": "Before broker import staging or broker import production.",
      "required_inputs": ["instrument master contract", "event ledger contract", "source registry", "privacy rules", "staging proposal"],
      "required_outputs": ["broker import staging readiness report", "blocking gaps"],
      "acceptance_criteria": ["staging contract exists", "broker symbols are not canonical IDs", "private data boundary is explicit", "event mapping remains review-required where uncertain"],
      "non_scope": ["broker parser", "production import", "broker API"],
      "blocks_features": ["broker_import_staging", "broker_import_production"],
      "evidence_required": ["staging contract evidence", "identity/event mapping review"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "PORTFOLIO_EVENT_LEDGER_RUNTIME_READINESS_REVIEW",
      "gate_name": "Portfolio Event Ledger Runtime Readiness Review",
      "priority": "P0",
      "purpose": "Review readiness for a production event ledger runtime, append-only store and event acceptance workflow.",
      "trigger_condition": "Before production Event Ledger, replay, backtesting, outcome attribution or broker import production.",
      "required_inputs": ["event ledger contract", "event template validator", "runtime design", "correction/reversal rules", "tests"],
      "required_outputs": ["event ledger runtime readiness report", "acceptance workflow findings"],
      "acceptance_criteria": ["append-only behavior defined and tested", "correction/reversal chains validated", "event acceptance is operator-gated", "private broker events are not in public handoff"],
      "non_scope": ["runtime implementation", "broker import implementation", "performance calculation"],
      "blocks_features": ["production_event_ledger", "replay", "backtesting", "outcome_attribution", "broker_import_production"],
      "evidence_required": ["runtime readiness matrix", "test coverage map"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "RELEASE_CI_ENVIRONMENT_PARITY_REVIEW",
      "gate_name": "Release CI Environment Parity Review",
      "priority": "P1",
      "purpose": "Review whether local validation, optional tooling and clean-room/CI environments agree on required commands.",
      "trigger_condition": "Before major release, CI gate adoption or external review packet acceptance.",
      "required_inputs": ["validation commands", "dependency notes", "test logs", "CI or clean-room logs"],
      "required_outputs": ["environment parity report", "unavailable tooling findings"],
      "acceptance_criteria": ["required tools are documented", "optional tool failures are classified", "no full-suite claim without execution"],
      "non_scope": ["CI platform implementation", "dependency upgrade"],
      "blocks_features": ["major_release_acceptance", "ci_gate_claims", "release_readiness_claims"],
      "evidence_required": ["local and clean-room command comparison"],
      "operator_acceptance_required": true
    },
    {
      "gate_id": "DASHBOARD_MISINTERPRETATION_REVIEW",
      "gate_name": "Dashboard Misinterpretation Review",
      "priority": "P1",
      "purpose": "Review whether dashboard surfaces can be mistaken for advice, broker readiness, event acceptance or action instructions.",
      "trigger_condition": "Before dashboard expansion, public demo surfaces or action-like UI.",
      "required_inputs": ["dashboard contract", "operator summaries", "report surfaces", "UI copy or mockups"],
      "required_outputs": ["dashboard interpretation findings", "blocked wording or signal list"],
      "acceptance_criteria": ["no action-like UI without review gate", "review states and data gaps remain visible", "dashboard stays read-only"],
      "non_scope": ["dashboard implementation", "investment advice"],
      "blocks_features": ["dashboard_expansion", "public_demo_surfaces", "action_or_signal_like_ui"],
      "evidence_required": ["surface review checklist", "operator acceptance record"],
      "operator_acceptance_required": true
    }
  ]
}
