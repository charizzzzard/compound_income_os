{
  "schema_version": "phase2a_raw_fundamentals_v1",
  "notes": [
    "Diese Datei ist JSON-kompatibles YAML und wird stdlib-only via json.load() gelesen.",
    "Legacy-Fundamentals koennen weiterhin voraggregierte Teil-Scores liefern.",
    "Raw-Fundamentals bevorzugen Roh-KPIs; Teil-Scores werden deterministisch aus configs/fundamentals_score_rules.yaml abgeleitet."
  ],
  "identity_fields": {
    "ticker": {"type": "string", "required": true},
    "isin": {"type": "string", "required": false},
    "company_name": {"type": "string", "required": true},
    "currency": {"type": "string", "required": false},
    "sector": {"type": "string", "required": true},
    "country": {"type": "string", "required": true},
    "asset_type": {"type": "string", "required": true},
    "sleeve": {"type": "string", "required": true},
    "data_quality_flag": {"type": "enum", "allowed": ["OK", "REVIEW", "MISSING_DATA"], "required": false},
    "company_type_profile": {"type": "enum", "allowed": ["STANDARD", "FINANCIAL", "REIT", "OTHER"], "required": false},
    "source_name": {"type": "string", "required": false},
    "source_as_of_date": {"type": "date", "required": false},
    "fiscal_period": {"type": "string", "required": false},
    "fiscal_year": {"type": "integer", "required": false},
    "report_date": {"type": "date", "required": false},
    "filing_date": {"type": "date", "required": false},
    "market_price_date": {"type": "date", "required": false},
    "calculation_version": {"type": "string", "required": false},
    "notes": {"type": "string", "required": false}
  },
  "raw_kpi_fields": {
    "revenue_cagr_5y": {"type": "float", "unit": "percent", "category": "growth"},
    "eps_cagr_5y": {"type": "float", "unit": "percent", "category": "growth"},
    "fcf_per_share_cagr_5y": {"type": "float", "unit": "percent", "category": "growth"},
    "roic": {"type": "float", "unit": "percent", "category": "quality"},
    "roce": {"type": "float", "unit": "percent", "category": "quality"},
    "gross_margin": {"type": "float", "unit": "percent", "category": "quality"},
    "operating_margin": {"type": "float", "unit": "percent", "category": "quality"},
    "fcf_margin": {"type": "float", "unit": "percent", "category": "quality"},
    "net_debt_to_ebitda": {"type": "float", "unit": "multiple", "category": "balance_sheet"},
    "interest_coverage": {"type": "float", "unit": "multiple", "category": "balance_sheet"},
    "dividend_yield_current_pct": {"type": "float", "unit": "percent", "category": "dividend"},
    "dividend_yield_hist_pct": {"type": "float", "unit": "percent", "category": "dividend"},
    "dividend_cagr_5y": {"type": "float", "unit": "percent", "category": "dividend"},
    "dividend_streak_years": {"type": "float", "unit": "years", "category": "dividend"},
    "payout_ratio_eps": {"type": "float", "unit": "percent", "category": "dividend"},
    "payout_ratio_fcf": {"type": "float", "unit": "percent", "category": "dividend"},
    "share_count_cagr_5y": {"type": "float", "unit": "percent", "category": "capital_allocation"},
    "buyback_yield": {"type": "float", "unit": "percent", "category": "capital_allocation"},
    "pe_current": {"type": "float", "unit": "multiple", "category": "valuation"},
    "pe_hist": {"type": "float", "unit": "multiple", "category": "valuation"},
    "ev_ebit_current": {"type": "float", "unit": "multiple", "category": "valuation"},
    "ev_ebit_hist": {"type": "float", "unit": "multiple", "category": "valuation"},
    "fcf_yield_current_pct": {"type": "float", "unit": "percent", "category": "valuation"},
    "fcf_yield_hist_pct": {"type": "float", "unit": "percent", "category": "valuation"},
    "normalized_fcf_yield_pct": {"type": "float", "unit": "percent", "category": "valuation"},
    "target_fcf_yield_pct": {"type": "float", "unit": "percent", "category": "valuation"},
    "drawdown_from_high_pct": {"type": "float", "unit": "percent", "category": "opportunity"},
    "expected_return_pct": {"type": "float", "unit": "percent", "category": "optional_expected_return"},
    "thesis_robustness": {"type": "enum", "allowed": ["ROBUST", "REVIEW", "FRAGILE", "BROKEN"], "category": "risk"},
    "has_hard_risk_flag": {"type": "bool", "category": "risk"}
  },
  "overlay_fields": {
    "overlay_thesis_robustness": {"type": "enum", "allowed": ["ROBUST", "REVIEW", "FRAGILE", "BROKEN"], "category": "analyst_overlay"},
    "overlay_has_hard_risk_flag": {"type": "bool", "category": "analyst_overlay"},
    "overlay_analyst_notes": {"type": "string", "category": "analyst_overlay"},
    "overlay_manual_override_flag": {"type": "bool", "category": "analyst_overlay"},
    "overlay_manual_override_reason": {"type": "string", "category": "analyst_overlay"}
  },
  "personal_master_required_columns": [
    "ticker",
    "isin",
    "company_name",
    "currency",
    "sector",
    "country",
    "asset_type",
    "company_type_profile",
    "source_name",
    "source_as_of_date",
    "fiscal_period",
    "fiscal_year",
    "report_date",
    "filing_date",
    "market_price_date",
    "calculation_version",
    "data_quality_flag",
    "notes",
    "sleeve",
    "current_price_eur",
    "mandate_fit_score",
    "revenue_cagr_5y",
    "eps_cagr_5y",
    "fcf_per_share_cagr_5y",
    "roic",
    "roce",
    "gross_margin",
    "operating_margin",
    "fcf_margin",
    "net_debt_to_ebitda",
    "interest_coverage",
    "dividend_yield_current_pct",
    "dividend_yield_hist_pct",
    "dividend_cagr_5y",
    "dividend_streak_years",
    "payout_ratio_eps",
    "payout_ratio_fcf",
    "share_count_cagr_5y",
    "buyback_yield",
    "pe_current",
    "pe_hist",
    "ev_ebit_current",
    "ev_ebit_hist",
    "fcf_yield_current_pct",
    "fcf_yield_hist_pct",
    "normalized_fcf_yield_pct",
    "target_fcf_yield_pct",
    "drawdown_from_high_pct",
    "expected_return_pct",
    "overlay_thesis_robustness",
    "overlay_has_hard_risk_flag",
    "overlay_analyst_notes",
    "overlay_manual_override_flag",
    "overlay_manual_override_reason"
  ],
  "raw_required_columns": [
    "ticker",
    "company_name",
    "sector",
    "country",
    "asset_type",
    "sleeve",
    "revenue_cagr_5y",
    "eps_cagr_5y",
    "fcf_per_share_cagr_5y",
    "roic",
    "roce",
    "gross_margin",
    "operating_margin",
    "fcf_margin",
    "net_debt_to_ebitda",
    "interest_coverage",
    "dividend_yield_current_pct",
    "dividend_yield_hist_pct",
    "dividend_cagr_5y",
    "dividend_streak_years",
    "payout_ratio_eps",
    "payout_ratio_fcf",
    "share_count_cagr_5y",
    "buyback_yield"
  ],
  "legacy_score_fields": [
    "quality_score",
    "dividend_score",
    "balance_sheet_score",
    "growth_quality_score",
    "capital_allocation_score"
  ]
}
